<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Why the Grass Has Stripes</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@800;900&family=JetBrains+Mono:wght@800&display=block" rel="stylesheet">
<style>
  :root{--bg:#04080a;--panel:#0d1117;--fg:#ecebe7;--mut:#8b8f99;--acc:#ffd24a;--line:#1c2a26}
  *{box-sizing:border-box}
  html,body{height:100%;margin:0}
  body{background:radial-gradient(120% 80% at 50% 0%,#0c2318 0%,var(--bg) 60%);color:var(--fg);
       font:500 13px/1.4 "Inter Tight",system-ui,-apple-system,Segoe UI,Roboto,sans-serif;
       display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;padding:12px;overflow:hidden}
  #stage{position:relative;height:min(calc(100vh - 92px),calc((100vw - 24px)*16/9));aspect-ratio:9/16;background:#000;
         border-radius:16px;overflow:hidden;box-shadow:0 30px 80px rgba(0,0,0,.7),0 0 0 1px rgba(255,255,255,.06)}
  #out{display:block;width:100%;height:100%}
  #ctl{display:flex;align-items:center;gap:6px;padding:6px;border-radius:14px;background:rgba(13,17,23,.85);border:1px solid var(--line);
       width:min(calc(100vw - 24px),max(560px,calc((100vh - 92px)*9/16 + 200px)))}
  button{background:transparent;color:var(--fg);border:1px solid transparent;border-radius:9px;padding:7px 9px;font:inherit;font-weight:800;cursor:pointer;letter-spacing:.02em}
  button:hover{background:#13201c;border-color:var(--line)}
  button.on{background:var(--acc);color:#03120a;border-color:var(--acc)}
  #play{min-width:38px;font-size:14px}
  #seek{flex:1;min-width:60px;accent-color:var(--acc)}
  #time{color:var(--mut);font:800 12px "JetBrains Mono",ui-monospace,monospace;min-width:86px;text-align:right}
  #rec{color:#ff4d4d}
  #rec.on{background:#ff3333;color:#fff;border-color:#ff3333}
  .sep{width:1px;height:20px;background:var(--line);margin:0 2px}
  .embed body{display:block;padding:0;overflow:hidden;background:#000}
  .embed #stage{position:fixed;left:0;top:0;width:1080px;height:1920px;aspect-ratio:auto;border-radius:0;box-shadow:none}
  .embed #ctl{display:none}
</style>
</head>
<body>
<div id="stage"><canvas id="out" width="1080" height="1920"></canvas></div>
<div id="ctl">
  <button id="play" title="Play / pause (Space)">❚❚</button>
  <div class="sep"></div>
  <button class="sc" data-s="0">Stripes</button><button class="sc" data-s="1">Roller</button><button class="sc" data-s="2">Lanes</button><button class="sc" data-s="3">Light</button><button class="sc" data-s="4">Swap</button>
  <div class="sep"></div>
  <input id="seek" type="range" min="0" max="33" step="0.001" value="0">
  <span id="time">0.0 / 33 s</span>
  <button id="rec" title="Record complete high-res pass (1080x1920)">● REC</button>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
"use strict";
window.addEventListener("error",e=>{let d=document.getElementById("err");if(!d){d=document.createElement("div");d.id="err";d.style.cssText="position:absolute;inset:0;z-index:9;background:#1a0f0f;color:#ffb4a8;padding:18px;font:13px/1.5 system-ui;overflow:auto";document.getElementById("stage").appendChild(d)}d.textContent="Error: "+e.message+" ("+(e.filename||"").split("/").pop()+":"+e.lineno+")"});
if(typeof THREE==="undefined"){document.getElementById("stage").innerHTML="<div style=\"padding:18px;color:#ffb4a8\">Three.js did not load (needs internet access to cdnjs.cloudflare.com). Check your connection or ad-blocker and reload.</div>";throw new Error("THREE missing")}
const EMBED=/[?&]embed=1/.test(location.search);if(EMBED)document.documentElement.classList.add("embed");

const CFG={title:'WHY THE GRASS HAS STRIPES',led:'MATCH DAY     •     PITCH CARE     •',rec:'why-the-grass-has-stripes',
  sdur:[6.0,6.8,6.0,6.6,7.2],
  looks:[['#3d74c9','#9ec6ee','#fff6dc',.55,'#ffd24a',.8],['#3d74c9','#9ec6ee','#fff6dc',.55,'#9dff6a',.8],['#3d74c9','#9ec6ee','#fff6dc',.55,'#5cf2ff',.8],
         ['#3d74c9','#9ec6ee','#fff6dc',.55,'#ffd24a',.8],['#3d74c9','#9ec6ee','#fff6dc',.55,'#9dff6a',.8]]};
/* FACTS: pitch stripes are not paint or two kinds of grass. A mower with a roller bends the blades in the direction it travels.
   Mowing up and back leaves neighbouring strips leaning opposite ways. Grass leaning away from you shows its broad, shiny
   side and looks lighter; grass leaning toward you shows tips and shadow and looks darker. From the other end, they swap.
   In this file one function, leanAt(), decides which way the grass leans; the ground and every blade are shaded from it,
   so the stripes you see (and their swap when the camera walks round) are produced by the scene, not painted on. */
/* =====================================================================================
   EXPLAINER TEMPLATE: rules this file follows (keep them for every new topic)
   1. One 1080x1920 canvas. Three.js draws the 3D; title, HUD, callouts and captions are drawn on top
      every frame, so REC, ?embed=1 and the MP4 renderer capture everything.
   2. Timing lives in SDUR/SSTART/TOTAL; setTiming([...]) re-times scenes to a voice-over. Choreography
      uses p = t/SDUR[i]; anything with a real-world speed (a ball in flight) uses seconds.
      Callout windows are fractions of the scene.
   3. Every frame is a pure function of time: no rnd() in updates, no state carried between frames.
      Shared objects (ball, players, props) are reset every frame, then posed by the scene.
   4. Each scene = its own overlay group + updateN(t) returning the HUD {main, sub, bar, stat}.
      The stadium, pitch, ball and players live in one shared world that every scene poses.
   5. One source of truth: what moves, what lights up and what the HUD says read the same values.
   6. Facts only (see the FACTS note below). If a number is uncertain, it is left out.
   7. Captions: 2 short cards per scene. Callout labels <= ~22 characters, stat values <= ~8 characters.
   8. Fade from black at the start and to black at the end, so the loop is seamless.
   9. Only show things a viewer can name or that the captions explain; one idea per scene.
  10. Keep the number of lights the same in every scene, or the shaders recompile at the cut.
   COMMON MISTAKES: wrong scene index in call(); child objects positioned in world coordinates;
   animating a shared material (clone it); rnd() in an update; invented precision; long labels.
   ===================================================================================== */

/* ============================== timing & helpers ============================== */
const NS=CFG.sdur.length,W=1080,H=1920;
let SDUR=[],SSTART=[],TOTAL=0;
function retime(d){SDUR=d.slice();SSTART=[];let a=0;d.forEach(x=>{SSTART.push(a);a+=x});TOTAL=a}
retime(CFG.sdur);
const clamp=(x,a=0,b=1)=>Math.min(b,Math.max(a,x));
const sm=x=>{x=clamp(x);return x*x*(3-2*x)};
const seg=(t,a,b)=>clamp((t-a)/(b-a));
const lerp=(a,b,k)=>a+(b-a)*k;
const V=(x,y,z)=>new THREE.Vector3(x,y,z);
const TAU=Math.PI*2;
const easeInOut=x=>{x=clamp(x);return x<.5?4*x*x*x:1-Math.pow(-2*x+2,3)/2};
const easeOutCubic=x=>1-Math.pow(1-clamp(x),3);
const easeOutBack=x=>{x=clamp(x);const c1=1.8,c3=c1+1;return 1+c3*Math.pow(x-1,3)+c1*Math.pow(x-1,2)};
const lin=hex=>new THREE.Color(hex).convertSRGBToLinear();

/* ============================== renderer + post ============================== */
const out=document.getElementById('out'),octx=out.getContext('2d',{alpha:false});
const renderer=new THREE.WebGLRenderer({antialias:false,alpha:false,powerPreference:'high-performance'});
renderer.setPixelRatio(1);renderer.setSize(W,H,false);
renderer.outputEncoding=THREE.LinearEncoding;renderer.toneMapping=THREE.NoToneMapping;
renderer.shadowMap.enabled=true;renderer.shadowMap.type=THREE.PCFSoftShadowMap;
const glCanvas=renderer.domElement;
const GL2=renderer.capabilities.isWebGL2;
const FT=GL2?THREE.HalfFloatType:THREE.UnsignedByteType;
const rtOpt=d=>({minFilter:THREE.LinearFilter,magFilter:THREE.LinearFilter,format:THREE.RGBAFormat,type:FT,depthBuffer:d,stencilBuffer:false});
const rtScene=GL2?new THREE.WebGLMultisampleRenderTarget(W,H,rtOpt(true)):new THREE.WebGLRenderTarget(W,H,rtOpt(true));
if(GL2)rtScene.samples=4;
const MIPS=[];{let w=W,h=H;for(let i=0;i<6;i++){w=Math.max(2,Math.round(w/2));h=Math.max(2,Math.round(h/2));MIPS.push({d:new THREE.WebGLRenderTarget(w,h,rtOpt(false)),u:new THREE.WebGLRenderTarget(w,h,rtOpt(false)),w,h})}}
const fsCam=new THREE.OrthographicCamera(-1,1,1,-1,0,1),fsScene=new THREE.Scene(),fsQuad=new THREE.Mesh(new THREE.PlaneGeometry(2,2));
fsQuad.frustumCulled=false;fsScene.add(fsQuad);
const FSV='varying vec2 vUv;void main(){vUv=uv;gl_Position=vec4(position.xy,0.,1.);}';
const fsMat=(u,f)=>new THREE.ShaderMaterial({uniforms:u,vertexShader:FSV,fragmentShader:f,depthTest:false,depthWrite:false});
const downMat=fsMat({tSrc:{value:null},uTx:{value:new THREE.Vector2()},uFirst:{value:0}},`
uniform sampler2D tSrc;uniform vec2 uTx;uniform float uFirst;varying vec2 vUv;
vec3 s(vec2 uv){vec3 c=texture2D(tSrc,uv).rgb;return uFirst>.5?min(c,vec3(35.)):c;}
void main(){vec3 c=s(vUv)*4.+s(vUv-uTx)+s(vUv+uTx)+s(vUv+vec2(uTx.x,-uTx.y))+s(vUv+vec2(-uTx.x,uTx.y));gl_FragColor=vec4(c*.125,1.);}`);
const upMat=fsMat({tLow:{value:null},tHigh:{value:null},uTx:{value:new THREE.Vector2()}},`
uniform sampler2D tLow,tHigh;uniform vec2 uTx;varying vec2 vUv;
vec3 s(vec2 o){return texture2D(tLow,vUv+o*uTx).rgb;}
void main(){vec3 c=s(vec2(-2.,0.))+s(vec2(2.,0.))+s(vec2(0.,-2.))+s(vec2(0.,2.))+2.*(s(vec2(-1.,1.))+s(vec2(1.,1.))+s(vec2(1.,-1.))+s(vec2(-1.,-1.)));
gl_FragColor=vec4(c/12.+texture2D(tHigh,vUv).rgb,1.);}`);
const compMat=fsMat({tHDR:{value:null},tBloom:{value:null},uRes:{value:new THREE.Vector2(W,H)},uTime:{value:0},uExp:{value:1},uBloom:{value:.11},
  uWhip:{value:0},uFlash:{value:0},uFade:{value:0},uCA:{value:.005},uGrain:{value:.04},uVig:{value:.58},uEdge:{value:.35},uSat:{value:1.08}},`
uniform sampler2D tHDR,tBloom;uniform vec2 uRes;uniform float uTime,uExp,uBloom,uWhip,uFlash,uFade,uCA,uGrain,uVig,uEdge,uSat;varying vec2 vUv;
vec3 fit(vec3 v){vec3 a=v*(v+.0245786)-.000090537;vec3 b=v*(.983729*v+.4329510)+.238081;return a/b;}
vec3 aces(vec3 c){const mat3 I=mat3(vec3(.59719,.07600,.02840),vec3(.35458,.90834,.13383),vec3(.04823,.01566,.83777));
  const mat3 O=mat3(vec3(1.60475,-.10208,-.00327),vec3(-.53108,1.10813,-.07276),vec3(-.07367,-.00605,1.07602));return clamp(O*fit(I*(c/.6)),0.,1.);}
vec3 srgb(vec3 c){c=clamp(c,0.,1.);return mix(c*12.92,1.055*pow(c,vec3(1./2.4))-.055,step(.0031308,c));}
float hash(vec2 p){vec3 p3=fract(vec3(p.xyx)*.1031);p3+=dot(p3,p3.yzx+33.33);return fract((p3.x+p3.y)*p3.z);}
vec3 samp(vec2 uv){vec2 d=uv-.5;vec2 o=d*uCA*(.35+2.4*dot(d,d));return vec3(texture2D(tHDR,uv+o).r,texture2D(tHDR,uv).g,texture2D(tHDR,uv-o).b);}
void main(){
  vec3 col;
  if(uWhip>.002){col=vec3(0.);for(int i=0;i<16;i++){float f=float(i)/15.-.5;col+=samp(vUv+vec2(f*uWhip*.14,f*uWhip*.01));}col/=16.;}
  else col=samp(vUv);
  vec3 bl=texture2D(tBloom,vUv).rgb*(1./6.);
  vec2 q=vUv-.5;q.x*=uRes.x/uRes.y;float e=smoothstep(.36,.7,length(q));
  col=mix(col,bl,e*uEdge);
  col=mix(col,bl,uBloom)+max(bl-.85,0.)*.5;
  col=aces(col*uExp);
  float l=dot(col,vec3(.2126,.7152,.0722));col=mix(vec3(l),col,uSat);
  col=srgb(col);
  float v=length((vUv-.5)*vec2(1.,1.15));col*=1.-uVig*smoothstep(.32,.88,v);
  col+=uFlash*vec3(.85,.95,1.);
  col+=(hash(vUv*uRes+fract(uTime*7.31)*317.)-.5)*uGrain*(1.-.5*l);
  col*=1.-uFade;
  gl_FragColor=vec4(col,1.);
}`);
function pass(mat,target){fsQuad.material=mat;renderer.setRenderTarget(target);renderer.render(fsScene,fsCam)}

/* ============================== scene, sky & lights ============================== */
const scene=new THREE.Scene();
const camera=new THREE.PerspectiveCamera(40,W/H,.05,600);
const bgMat=new THREE.ShaderMaterial({uniforms:{uEdge:{value:new THREE.Color()},uMid:{value:new THREE.Color()},uGlow:{value:new THREE.Color()},uTime:{value:0}},
  vertexShader:'varying vec2 vUv;void main(){vUv=uv;gl_Position=vec4(position.xy,.9999,1.);}',
  fragmentShader:`uniform vec3 uEdge,uMid,uGlow;uniform float uTime;varying vec2 vUv;
void main(){
  vec2 p=vUv-vec2(.5,.52);p.x*=.5625;float r=length(p);
  vec3 c=mix(uMid,uEdge,smoothstep(.05,.65,r));
  c+=uGlow*exp(-r*r*12.)*.75;
  float u=vUv.x*.9+vUv.y*.42,sh=smoothstep(.07,0.,abs(u-.66-.03*sin(uTime*.31)))*.6+smoothstep(.035,0.,abs(u-.84+.02*sin(uTime*.23)))*.4;
  c+=uGlow*sh*smoothstep(.1,1.,vUv.y)*.22; // soft floodlight haze
  gl_FragColor=vec4(c,1.);
}`,depthWrite:false,depthTest:false});
const bgQuad=new THREE.Mesh(new THREE.PlaneGeometry(2,2),bgMat);bgQuad.frustumCulled=false;bgQuad.renderOrder=-100;scene.add(bgQuad);

const LOOKS=CFG.looks.map(l=>({edge:lin(l[0]),mid:lin(l[1]).multiplyScalar(1.2),glow:lin(l[2]).multiplyScalar(l[3]),acc:l[4],exp:l[5]||1}));

const hemi=new THREE.HemisphereLight(0xd5e6ff,0x15240f,.55);scene.add(hemi);
const key=new THREE.DirectionalLight(0xfff4e6,2.6);key.castShadow=true;key.shadow.mapSize.set(2048,2048);key.shadow.bias=-.0003;key.shadow.normalBias=.01;
scene.add(key,key.target);
const fillL=new THREE.DirectionalLight(0x9fc8ff,.7);scene.add(fillL);
const rimL=new THREE.DirectionalLight(0xffffff,1.1);scene.add(rimL);
const SUN=V(.38,.84,-.38).normalize(); // floodlights high on the pitch side: shadows fall toward the goal
function lightFocus(c,size){ // shadow map hugs whatever the scene is about
  key.target.position.copy(c);key.position.copy(c).addScaledVector(SUN,40);
  key.shadow.bias=-.0003*Math.max(1,size/10);key.shadow.normalBias=.01*Math.max(1,size/10); // bigger shadow area = coarser texels = more bias
  const s=key.shadow.camera;if(s.right!==size){s.left=-size;s.right=size;s.top=size;s.bottom=-size;s.near=1;s.far=90;s.updateProjectionMatrix()}
  fillL.position.set(c.x-8,c.y+6,c.z-10);rimL.position.set(c.x-6,c.y+10,c.z+14);
}

/* ============================== textures ============================== */
function cvs(w,h,fn){const c=document.createElement('canvas');c.width=w;c.height=h;fn(c.getContext('2d'),w,h);return c}
function tex(c,{rep=1,srgb=false,clamp=false}={}){const t=new THREE.CanvasTexture(c);t.wrapS=t.wrapT=clamp?THREE.ClampToEdgeWrapping:THREE.RepeatWrapping;
  t.repeat.set(rep,rep);if(srgb)t.encoding=THREE.sRGBEncoding;return t}
function rrp(g,x,y,w,h,r){g.beginPath();g.moveTo(x+r,y);g.arcTo(x+w,y,x+w,y+h,r);g.arcTo(x+w,y+h,x,y+h,r);g.arcTo(x,y+h,x,y,r);g.arcTo(x,y,x+w,y,r);g.closePath()}
let _sd=7;const rnd=()=>{_sd=(_sd*16807)%2147483647;return(_sd-1)/2147483646}; // seeded: only used while building textures, never inside an update
const MAXANI=renderer.capabilities.getMaxAnisotropy();

/* ---- labels and painted textures: painted again once the web fonts arrive ---- */
const LABELS=[],PAINTERS=[];
function paintLabel(L){const g=L.c.getContext('2d'),w=L.c.width,h=L.c.height;g.clearRect(0,0,w,h);g.font=`900 ${Math.round(h*.7)}px "Inter Tight",system-ui,sans-serif`;
  g.textAlign='center';g.textBaseline='middle';g.lineJoin='round';g.lineWidth=h*.09;g.strokeStyle='rgba(2,6,14,.9)';g.strokeText(L.txt,w/2,h*.54);g.fillStyle=L.col;g.fillText(L.txt,w/2,h*.54);L.t.needsUpdate=true}
function drawLabels(){LABELS.forEach(paintLabel);PAINTERS.forEach(f=>f())}
function labelSprite(txt,col,sc,wide){const c=wide?cvs(256,96,()=>{}):cvs(128,128,()=>{}),t=tex(c,{srgb:true,clamp:true}),L={c,t,txt,col};LABELS.push(L);paintLabel(L);
  const s=new THREE.Sprite(new THREE.SpriteMaterial({map:t,color:new THREE.Color(1.35,1.35,1.35),transparent:true,depthWrite:false}));s.scale.set(wide?sc*256/96:sc,sc,1);s.renderOrder=6;return s}

const T_GLOW=tex(cvs(128,128,(g,w,h)=>{
  const gr=g.createRadialGradient(64,64,0,64,64,64);
  gr.addColorStop(0,'rgba(255,255,255,1)');gr.addColorStop(.2,'rgba(255,255,255,.6)');gr.addColorStop(.6,'rgba(255,255,255,.12)');gr.addColorStop(1,'rgba(255,255,255,0)');
  g.fillStyle=gr;g.fillRect(0,0,w,h);
}),{clamp:true});
// mowed grass: two stripe shades per tile (one tile = 11 m), plus blade speckle
const T_GRASS=(()=>{const t=tex(cvs(512,512,(g,w,h)=>{
  g.fillStyle='#3c8d35';g.fillRect(0,0,w,h/2);g.fillStyle='#2f7a2b';g.fillRect(0,h/2,w,h/2);
  for(let i=0;i<14000;i++){const x=rnd()*w,y=rnd()*h,l=rnd();g.fillStyle=l<.5?`rgba(18,55,14,${.3*rnd()})`:`rgba(150,210,100,${.16*rnd()})`;g.fillRect(x,y,1+rnd()*1.5,2+rnd()*4)}
}),{srgb:true});t.anisotropy=MAXANI;return t})();
// crowd: rows of seats with people in them
const T_CROWD=(()=>{const t=tex(cvs(1024,512,(g,w,h)=>{g.fillStyle='#0a0d15';g.fillRect(0,0,w,h);
  const cols=['#c8d3e6','#e8ecf2','#d9343a','#2f5fd0','#f2c230','#1a1d24','#8a93a6','#ffffff','#d9343a','#2f5fd0'];
  for(let r=0;r<32;r++){const y=r*16+9;g.globalAlpha=1;g.fillStyle='rgba(255,255,255,.05)';g.fillRect(0,y+5,w,2);
    for(let x=4;x<w;x+=10+rnd()*5){if(rnd()<.1)continue;g.globalAlpha=.55+.45*rnd();g.fillStyle=cols[(rnd()*cols.length)|0];g.beginPath();g.ellipse(x,y,3.6,4.4,0,0,TAU);g.fill();
      g.fillStyle='#d2b294';g.beginPath();g.arc(x,y-6,2.4,0,TAU);g.fill()}}
  g.globalAlpha=1}),{srgb:true});t.anisotropy=MAXANI;return t})();
// goal net: one diamond per tile
const T_NET=(()=>{const t=tex(cvs(128,128,(g,w,h)=>{g.clearRect(0,0,w,h);g.strokeStyle='rgba(255,255,255,.95)';g.lineWidth=6;g.beginPath();g.moveTo(0,0);g.lineTo(w,h);g.moveTo(w,0);g.lineTo(0,h);g.stroke()}),{srgb:true});t.anisotropy=MAXANI;return t})();
// the "goal plane": strongest at the line, fading upward, with scan lines
const T_PLANE=tex(cvs(64,256,(g,w,h)=>{const gr=g.createLinearGradient(0,0,0,h);gr.addColorStop(0,'rgba(255,255,255,0)');gr.addColorStop(.55,'rgba(255,255,255,.22)');gr.addColorStop(1,'rgba(255,255,255,.75)');
  g.fillStyle=gr;g.fillRect(0,0,w,h);for(let y=0;y<h;y+=8){g.fillStyle='rgba(255,255,255,.16)';g.fillRect(0,y,w,2)}}),{clamp:true});
// LED advertising boards
const T_LED=(()=>{const c=cvs(1024,64,()=>{}),t=tex(c,{srgb:true});t.anisotropy=MAXANI;
  const paint=()=>{const g=c.getContext('2d');g.fillStyle='#04101c';g.fillRect(0,0,1024,64);const gr=g.createLinearGradient(0,0,1024,0);gr.addColorStop(0,'#1a3cff');gr.addColorStop(.5,'#18d6ff');gr.addColorStop(1,'#1a3cff');
    g.fillStyle=gr;g.fillRect(0,0,1024,5);g.fillRect(0,59,1024,5);g.font='900 32px "Inter Tight",system-ui,sans-serif';g.textBaseline='middle';g.fillStyle='#e9f6ff';
    g.fillText(CFG.led,24,33);t.needsUpdate=true};
  paint();PAINTERS.push(paint);return t})();
// classic 32-panel ball: 12 black pentagons on the icosahedron's corners, white hexagons, grey seams
const T_BALL=(()=>{
  const w=1024,h=512,c=cvs(w,h,()=>{}),g=c.getContext('2d'),img=g.createImageData(w,h),d=img.data;
  const ico=new THREE.IcosahedronGeometry(1,0),P=ico.attributes.position,VX=[],FC=[];
  for(let i=0;i<P.count;i++){const v=V(P.getX(i),P.getY(i),P.getZ(i)).normalize();if(!VX.some(u=>u.distanceToSquared(v)<1e-6))VX.push(v)}
  for(let i=0;i<P.count;i+=3)FC.push(V(P.getX(i)+P.getX(i+1)+P.getX(i+2),P.getY(i)+P.getY(i+1)+P.getY(i+2),P.getZ(i)+P.getZ(i+1)+P.getZ(i+2)).normalize());

/* ---- goal: posts and bar are 12 cm wide and stand ON the line; the net hangs behind ---- */
function buildGoal(){
  const g=new THREE.Group(),HW=GW/2+PR,TOP=GH+PR,PZ=-LW/2;
  [-HW,HW].forEach(x=>{const p=cyl(PR,PR,TOP+PR,28,MAT.post);p.position.set(x,(TOP+PR)/2,PZ);g.add(p)});
  const bar=cyl(PR,PR,2*HW+2*PR,28,MAT.post);bar.rotation.z=Math.PI/2;bar.position.set(0,TOP,PZ);g.add(bar);
  const TOPZ=1.0,BACK=2.2,X=V(1,0,0),Y=V(0,1,0),Z=V(0,0,1),slope=V(0,-TOP,BACK-TOPZ).normalize(),C=.13;
  const nets=[
    polyMesh([V(-HW,TOP,PZ),V(HW,TOP,PZ),V(HW,TOP,TOPZ),V(-HW,TOP,TOPZ)],MAT.net,X,Z,C),
    polyMesh([V(-HW,TOP,TOPZ),V(HW,TOP,TOPZ),V(HW,0,BACK),V(-HW,0,BACK)],MAT.net,X,slope,C),
    ...[-HW,HW].map(x=>polyMesh([V(x,0,PZ),V(x,TOP,PZ),V(x,TOP,TOPZ),V(x,0,BACK)],MAT.net,Z,Y,C))];
  nets.forEach(n=>{n.renderOrder=2;g.add(n)});

  return {root:g,barTag:tag(g,.95,TOP,PZ)};
}

  const words=[];let hl=false;txt.split(' ').forEach(wd=>{let w=wd,st=hl;if(w.startsWith('*')){st=true;w=w.slice(1)}let end=false;if(w.endsWith('*')){end=true;w=w.slice(0,-1)}else if(/\*[.,:;!?]$/.test(w)){end=true;w=w.replace('*','')}words.push({t:w,hl:st,w:g.measureText(w).width});hl=end?false:st});
  const sp=g.measureText(' ').width,maxW=880,lines=[[]];let cw=0;
  words.forEach(o=>{if(cw&&cw+sp+o.w>maxW){lines.push([]);cw=0}lines[lines.length-1].push(o);cw+=(cw?sp:0)+o.w});
  const lw=lines.map(L=>L.reduce((s,o,i)=>s+o.w+(i?sp:0),0));
  return capCache[txt]={lines,lw,sp,bw:Math.max(...lw)+80,bh:lines.length*80+44};
}

function drawCaption(txt,age,acc){
  const g=octx,L=capLayout(txt),bx=(W-L.bw)/2,by=1530-L.bh,ka=easeOutCubic(age/.3);
  g.save();g.globalAlpha=ka;const sc=.94+.06*ka;g.translate(W/2,by+L.bh/2);g.scale(sc,sc);g.translate(-W/2,-(by+L.bh/2));
  frost(bx,by,L.bw,L.bh,30,.5);g.restore();
  g.font='800 62px '+FONT;ls(0);g.textBaseline='alphabetic';g.textAlign='left';let wi=0;
  L.lines.forEach((line,li)=>{let x=(W-L.lw[li])/2;const y=by+22+li*80+62;
    line.forEach(o=>{const d=wi*.07,k=clamp((age-d)/.3);wi++;
      if(k>0){const s=.6+.4*easeOutBack(k);g.save();g.globalAlpha=clamp(k*1.6);g.translate(x+o.w/2,y-22);g.scale(s,s);g.translate(-(x+o.w/2),-(y-22)+(1-k)*16);
        g.shadowColor='rgba(0,0,0,.55)';g.shadowBlur=10;g.shadowOffsetY=3;g.fillStyle=o.hl?acc:'#ffffff';g.fillText(o.t,x,y);g.restore()}
      x+=o.w+L.sp});
  });
}

const _sv=new THREE.Vector3();
function toScreen(obj,p){_sv.copy(p);obj.localToWorld(_sv);_sv.project(camera);if(_sv.z>1||_sv.z<-1)return null;return[(_sv.x+1)/2*W,(1-_sv.y)/2*H]}

function drawCallout(c,tl,acc){
  const kin=seg(tl,c.t0,c.t0+.7),kout=1-seg(tl,c.t1-.4,c.t1);if(kin<=0||kout<=0)return;
  const pt=toScreen(c.obj,c.p);if(!pt)return;const g=octx,[ax,ay]=pt;if(ax<-50||ax>W+50||ay<350||ay>1500)return;
  g.font='800 36px '+FONT;ls(3);const tw=g.measureText(c.text).width,pw=tw+56,ph=66;
  let side=c.side||(ax<W/2?-1:1);const ex=ax+side*90,ey=ay-110;
  let px=side>0?ex+18:ex-18-pw;if(px<36){side=1;px=Math.max(36,ax+108)}if(px+pw>W-36)px=W-36-pw;
  const py=clamp(ey-ph/2,360,1400),cy=py+ph/2,a=kout;
  const kl=easeOutCubic(kin/.6),kp=easeOutBack(seg(kin,.45,1));
  g.save();g.globalAlpha=a;
  g.strokeStyle='rgba(255,255,255,.95)';g.lineWidth=3.5;g.shadowColor='rgba(0,0,0,.5)';g.shadowBlur=8;
  const jx=side>0?px:px+pw,P=[[ax,ay],[ex,cy],[jx,cy]];const L1=Math.hypot(P[1][0]-P[0][0],P[1][1]-P[0][1]),L2=Math.abs(P[2][0]-P[1][0]),tot=L1+L2,dl=kl*tot;
  g.beginPath();g.moveTo(ax,ay);if(dl<=L1){const u=dl/L1;g.lineTo(lerp(ax,P[1][0],u),lerp(ay,P[1][1],u))}else{g.lineTo(P[1][0],P[1][1]);g.lineTo(lerp(P[1][0],P[2][0],(dl-L1)/(L2||1)),cy)}g.stroke();
  g.shadowBlur=0;
  const pr=10+3*Math.sin(tl*5);g.fillStyle=acc;g.beginPath();g.arc(ax,ay,pr*sm(kin*3),0,TAU);g.fill();
  g.strokeStyle='#fff';g.lineWidth=3;g.beginPath();g.arc(ax,ay,(pr+8)*sm(kin*3),0,TAU);g.stroke();
  if(kp>0){g.globalAlpha=a*clamp(kp);const cx=px+pw/2;g.translate(cx,cy);g.scale(.7+.3*kp,.7+.3*kp);g.translate(-cx,-cy);
    rrp(g,px,py,pw,ph,ph/2);g.fillStyle='rgba(8,11,22,.86)';g.fill();g.strokeStyle=acc;g.lineWidth=3;g.stroke();
    g.fillStyle='#fff';g.textBaseline='middle';g.textAlign='center';g.fillText(c.text,cx+1.5,cy+2)}
  g.restore();ls(0);
}

function drawHUD(st){
  const g=octx,h=st.h,acc=st.acc,x=150,y=150,w=780,hh2=170;frost(x,y,w,hh2,32,.55);
  g.save();g.textBaseline='alphabetic';g.textAlign='left';
  let sw=0;if(h.stat){g.font='800 44px '+MONO;ls(0);const a=g.measureText(h.stat[1]).width;g.font='800 24px '+FONT;ls(3);sw=Math.max(a,g.measureText(h.stat[0]).width)+40}
  g.font='800 64px '+MONO;ls(0);const room=w-80-sw,mw=g.measureText(h.main).width,fs=mw>room?Math.floor(64*room/mw):64; // shrink to fit: never runs into the stat
  g.font='800 '+fs+'px '+MONO;g.fillStyle='#fff';g.shadowColor='rgba(0,0,0,.5)';g.shadowBlur=8;g.fillText(h.main,x+40,y+84);g.shadowBlur=0;
  const sub=h.sub.toUpperCase();g.font='800 26px '+FONT;ls(2);const s2=g.measureText(sub).width,ss=s2>w-80?Math.floor(26*(w-80)/s2):26; // long sub lines shrink instead of overflowing
  g.font='800 '+ss+'px '+FONT;g.fillStyle='rgba(255,255,255,.72)';g.fillText(sub,x+40,y+126);
  const bx=x+40,by=y+hh2-26,bw=w-80;rrp(g,bx,by,bw,10,5);g.fillStyle='rgba(255,255,255,.16)';g.fill();
  rrp(g,bx,by,Math.max(10,bw*clamp(h.bar)),10,5);g.fillStyle=acc;g.fill();
  if(h.stat){g.textAlign='right';g.font='800 24px '+FONT;ls(3);g.fillStyle=acc;g.fillText(h.stat[0],x+w-40,y+44);
    g.font='800 44px '+MONO;ls(0);g.fillStyle='#fff';g.fillText(h.stat[1],x+w-40,y+96)}
  g.restore();ls(0);
}

const _cw={};
function drawOverlay(st){
  const g=octx;
  const T=CFG.title;
  g.save();g.font='900 64px '+FONT;ls(3);let sz=64;const tw=g.measureText(T).width;if(tw>940)sz=64*940/tw;
  g.font='900 '+sz+'px '+FONT;g.textAlign='center';g.textBaseline='middle';g.lineJoin='round';g.lineWidth=14;g.strokeStyle='rgba(3,8,18,.92)';g.strokeText(T,W/2,90);
  g.shadowColor=st.acc;g.shadowBlur=22;g.fillStyle=st.acc;g.fillText(T,W/2,90);g.restore();ls(0);

  const dur=SDUR[st.si]; // callout windows are stored as fractions of the scene
  CALL.forEach(c=>{if(c.si!==st.si)return;Object.assign(_cw,c);_cw.t0=c.t0*dur;_cw.t1=c.t1*dur;drawCallout(_cw,st.tr,st.acc)});
  drawHUD(st);
  const cs=CAPS[st.si];let ci=0;cs.forEach((c,i)=>{if(st.tr>=c[0])ci=i});drawCaption(cs[ci][1],st.tr-cs[ci][0],st.acc);
}

/* ============================== animation loop ============================== */
const updaters=[update0,update1,update2,update3,update4];
const el={seek:document.getElementById('seek'),time:document.getElementById('time'),play:document.getElementById('play'),rec:document.getElementById('rec')};
el.seek.max=TOTAL;
function setTiming(d){retime(d);el.seek.max=TOTAL}
let T_TIME=0,playing=true,recording=null,lastScene=-1,ST=null;

function update(t){
  t=clamp(t||0,0,TOTAL-1e-4);
  let si=NS-1;for(let i=0;i<NS;i++){if(t<SSTART[i]+SDUR[i]){si=i;break}}
  const dur=SDUR[si],tr=t-SSTART[si],look=LOOKS[si%LOOKS.length];
  groups.forEach((g,i)=>g.visible=i===si);
  resetShared();
  const h=updaters[si](tr);
  lightFocus(FOCUS[si].c,FOCUS[si].s);
  bgMat.uniforms.uEdge.value.copy(look.edge);bgMat.uniforms.uMid.value.copy(look.mid);bgMat.uniforms.uGlow.value.copy(look.glow);bgMat.uniforms.uTime.value=t;

  const U=compMat.uniforms;U.uTime.value=t;U.uExp.value=look.exp;
  // whip-pan across every cut (motion blur + soft flash, 0.16 s each side), plus any cut inside a scene
  const WH=.16;let wv=0;if(si>0&&tr<WH)wv=Math.pow(1-tr/WH,2);if(si<NS-1&&tr>dur-WH)wv=Math.pow(1-(dur-tr)/WH,2);wv=Math.max(wv,h.whip||0);
  U.uWhip.value=wv;U.uFlash.value=.15*wv*wv+(h.flash||0);
  U.uFade.value=Math.max(1-seg(t,0,.3),seg(t,TOTAL-.4,TOTAL)); // black at both ends: the loop is seamless

  scene.updateMatrixWorld(true);
  if(si!==lastScene){lastScene=si;document.querySelectorAll('.sc').forEach(b=>b.classList.toggle('on',+b.dataset.s===si))}
  if(document.activeElement!==el.seek)el.seek.value=t;
  el.time.textContent=t.toFixed(1)+' / '+TOTAL.toFixed(0)+' s';
  ST={si,tr,T:t,h,acc:look.acc};
}

function renderFrame(){
  renderer.setRenderTarget(rtScene);renderer.render(scene,camera);
  let src=rtScene.texture,sw=W,sh=H;
  MIPS.forEach((m,i)=>{downMat.uniforms.tSrc.value=src;downMat.uniforms.uTx.value.set(1/sw,1/sh);downMat.uniforms.uFirst.value=i?0:1;pass(downMat,m.d);src=m.d.texture;sw=m.w;sh=m.h});
  for(let i=MIPS.length-2;i>=0;i--){const low=i===MIPS.length-2?MIPS[i+1].d:MIPS[i+1].u;upMat.uniforms.tLow.value=low.texture;upMat.uniforms.tHigh.value=MIPS[i].d.texture;
    upMat.uniforms.uTx.value.set(.5/MIPS[i+1].w,.5/MIPS[i+1].h);pass(upMat,MIPS[i].u)}
  compMat.uniforms.tHDR.value=rtScene.texture;compMat.uniforms.tBloom.value=MIPS[0].u.texture;pass(compMat,null);
  octx.drawImage(glCanvas,0,0);
  if(ST)drawOverlay(ST);
  const f=compMat.uniforms.uFade.value;if(f>0){octx.fillStyle=`rgba(0,0,0,${f})`;octx.fillRect(0,0,W,H)}
}

let lastNow=performance.now();
function loop(now){
  const dt=clamp((now-lastNow)/1000,0,.1);lastNow=now;
  if(playing){T_TIME+=dt;if(T_TIME>=TOTAL){if(recording)stopRec();T_TIME=0}}
  update(T_TIME);renderFrame();requestAnimationFrame(loop);
}

const setPlay=p=>{playing=p;el.play.textContent=p?'❚❚':'▶'};
el.play.onclick=()=>setPlay(!playing);
el.seek.oninput=()=>{T_TIME=+el.seek.value};
document.querySelectorAll('.sc').forEach(b=>b.onclick=()=>{T_TIME=SSTART[+b.dataset.s]+.01});
window.addEventListener('keydown',e=>{
  if(e.code==='Space'){e.preventDefault();el.play.click()}
  if(e.code==='ArrowRight')T_TIME=Math.min(TOTAL-.01,T_TIME+.5);
  if(e.code==='ArrowLeft')T_TIME=Math.max(0,T_TIME-.5);
});

function stopRec(){if(recording){recording.stop();recording=null;el.rec.textContent='● REC';el.rec.classList.remove('on')}}
el.rec.onclick=()=>{
  if(recording){stopRec();return}
  if(!window.MediaRecorder||!out.captureStream){alert('Recording unsupported');return}
  const types=['video/mp4;codecs=avc1.640028','video/mp4','video/webm;codecs=vp9','video/webm'],mime=types.find(m=>MediaRecorder.isTypeSupported(m))||'';
  const stream=out.captureStream(60),chunks=[],mr=new MediaRecorder(stream,mime?{mimeType:mime,videoBitsPerSecond:20e6}:{videoBitsPerSecond:20e6});
  const ext=(mr.mimeType||mime).includes('mp4')?'mp4':'webm';
  mr.ondataavailable=e=>e.data.size&&chunks.push(e.data);
  mr.onstop=()=>{const a=document.createElement('a');a.href=URL.createObjectURL(new Blob(chunks,{type:mr.mimeType||'video/'+ext}));a.download=CFG.rec+'.'+ext;a.click()};
  T_TIME=0;setPlay(true);recording=mr;mr.start(250);el.rec.textContent='■ STOP';el.rec.classList.add('on');
};

// render hook (see README): duration in real seconds, seek(seconds) draws that exact frame
window.VIDEO={get duration(){return TOTAL},seek(s){T_TIME=s;setPlay(false);update(s);renderFrame()}};
const fontsReady=Promise.race([Promise.all(['800 40px "Inter Tight"','900 40px "Inter Tight"','800 40px "JetBrains Mono"'].map(f=>document.fonts.load(f))).catch(()=>{}),new Promise(r=>setTimeout(r,2000))]);
fontsReady.then(()=>{drawLabels();update(0);renderFrame();window.__ready=true;if(!EMBED)requestAnimationFrame(loop)});
</script>
