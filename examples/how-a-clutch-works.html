<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>How a Manual Car Clutch Works</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@800;900&family=JetBrains+Mono:wght@800&display=block" rel="stylesheet">
<style>
  :root{--bg:#07080b;--panel:#12141a;--fg:#ecebe7;--mut:#8b8f99;--acc:#ffc93c;--line:#262a33}
  *{box-sizing:border-box}
  html,body{height:100%;margin:0}
  body{background:radial-gradient(120% 80% at 50% 0%,#141826 0%,var(--bg) 60%);color:var(--fg);
       font:500 13px/1.4 "Inter Tight",system-ui,-apple-system,Segoe UI,Roboto,sans-serif;
       display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;padding:12px;overflow:hidden}
  #stage{position:relative;height:min(calc(100vh - 92px),calc((100vw - 24px)*16/9));aspect-ratio:9/16;background:#000;
         border-radius:16px;overflow:hidden;box-shadow:0 30px 80px rgba(0,0,0,.7),0 0 0 1px rgba(255,255,255,.06)}
  #out{display:block;width:100%;height:100%}
  #ctl{display:flex;align-items:center;gap:6px;padding:6px;border-radius:14px;background:rgba(18,20,26,.85);border:1px solid var(--line);
       width:min(calc(100vw - 24px),max(520px,calc((100vh - 92px)*9/16 + 160px)))}
  button{background:transparent;color:var(--fg);border:1px solid transparent;border-radius:9px;padding:7px 10px;font:inherit;font-weight:800;cursor:pointer;letter-spacing:.02em}
  button:hover{background:#1c2029;border-color:var(--line)}
  button.on{background:var(--acc);color:#111;border-color:var(--acc)}
  #play{min-width:38px;font-size:14px}
  #seek{flex:1;min-width:60px;accent-color:var(--acc)}
  #time{color:var(--mut);font:800 12px "JetBrains Mono",ui-monospace,monospace;min-width:86px;text-align:right}
  #rec{color:#ff5a5a}
  #rec.on{background:#ff3b3b;color:#fff;border-color:#ff3b3b}
  .sep{width:1px;height:20px;background:var(--line);margin:0 2px}
</style>
</head>
<body>
<div id="stage"><canvas id="out" width="1080" height="1920"></canvas></div>
<div id="ctl">
  <button id="play" title="Play / pause (Space)">❚❚</button>
  <div class="sep"></div>
  <button class="sc" data-s="0">Parts</button><button class="sc" data-s="1">Engaged</button><button class="sc" data-s="2">Pedal down</button>
  <button class="sc" data-s="3">Bite</button><button class="sc" data-s="4">Cycle</button>
  <div class="sep"></div>
  <input id="seek" type="range" min="0" max="30" step="0.001" value="0">
  <span id="time">0.0 / 50 s</span>
  <button id="rec" title="Records one full pass (picture, captions and labels) at 1080×1920">● REC</button>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
"use strict";
window.addEventListener("error",e=>{let d=document.getElementById("err");if(!d){d=document.createElement("div");d.id="err";d.style.cssText="position:absolute;inset:0;z-index:9;background:#1a0f0f;color:#ffb4a8;padding:18px;font:13px/1.5 system-ui;overflow:auto";document.getElementById("stage").appendChild(d)}d.textContent="Error: "+e.message+" ("+(e.filename||"").split("/").pop()+":"+e.lineno+")"});
if(typeof THREE==="undefined"){document.getElementById("stage").innerHTML="<div style=\"padding:18px;color:#ffb4a8\">Three.js did not load (needs internet access to cdnjs.cloudflare.com). Check your connection or ad-blocker and reload.</div>";throw new Error("THREE missing")}

/* ============================== helpers ============================== */
const NS=5,SCENE_T=6,TOTAL=NS*SCENE_T,SLOW=1.67,W=1080,H=1920;
const clamp=(x,a=0,b=1)=>Math.min(b,Math.max(a,x));
const sm=x=>{x=clamp(x);return x*x*(3-2*x)};
const seg=(t,a,b)=>clamp((t-a)/(b-a));
const lerp=(a,b,k)=>a+(b-a)*k;
const V=(x,y,z)=>new THREE.Vector3(x,y,z);
const D2R=Math.PI/180,TAU=Math.PI*2;
const easeInOut=x=>{x=clamp(x);return x<.5?4*x*x*x:1-Math.pow(-2*x+2,3)/2};
const easeOutBack=x=>{x=clamp(x);const c1=1.9,c3=c1+1;return 1+c3*Math.pow(x-1,3)+c1*Math.pow(x-1,2)};
const easeOutCubic=x=>1-Math.pow(1-clamp(x),3);
let _sd=11;const rnd=()=>{_sd=(_sd*16807)%2147483647;return(_sd-1)/2147483646};
const lin=hex=>new THREE.Color(hex).convertSRGBToLinear();

/* ============================== renderer + post ============================== */
const out=document.getElementById('out'),octx=out.getContext('2d',{alpha:false});
const renderer=new THREE.WebGLRenderer({antialias:false,alpha:false,powerPreference:'high-performance'});
renderer.setPixelRatio(1);renderer.setSize(W,H,false);
renderer.outputEncoding=THREE.LinearEncoding;renderer.toneMapping=THREE.NoToneMapping;   // tone mapping happens in the composite pass
renderer.shadowMap.enabled=true;renderer.shadowMap.type=THREE.PCFSoftShadowMap;
const glCanvas=renderer.domElement;
const GL2=renderer.capabilities.isWebGL2;
const FT=GL2?THREE.HalfFloatType:THREE.UnsignedByteType;
const rtOpt=d=>({minFilter:THREE.LinearFilter,magFilter:THREE.LinearFilter,format:THREE.RGBAFormat,type:FT,depthBuffer:d,stencilBuffer:false});
const rtScene=GL2?new THREE.WebGLMultisampleRenderTarget(W,H,rtOpt(true)):new THREE.WebGLRenderTarget(W,H,rtOpt(true));
if(GL2)rtScene.samples=4;
const MIPS=[];{let w=W,h=H;for(let i=0;i<6;i++){w=Math.max(2,Math.round(w/2));h=Math.max(2,Math.round(h/2));MIPS.push({d:new THREE.WebGLRenderTarget(w,h,rtOpt(false)),u:new THREE.WebGLRenderTarget(w,h,rtOpt(false)),w,h})}}
const fsCam=new THREE.OrthographicCamera(-1,1,1,-1,0,1),fsScene=new THREE.Scene(),fsQuad=new THREE.Mesh(new THREE.PlaneGeometry(2,2));
fsQuad.frustumCulled=false;fsScene.add(fsQuad);
const FSV='varying vec2 vUv;void main(){vUv=uv;gl_Position=vec4(position.xy,0.,1.);}';
const fsMat=(u,f)=>new THREE.ShaderMaterial({uniforms:u,vertexShader:FSV,fragmentShader:f,depthTest:false,depthWrite:false});
const downMat=fsMat({tSrc:{value:null},uTx:{value:new THREE.Vector2()},uFirst:{value:0}},`
uniform sampler2D tSrc;uniform vec2 uTx;uniform float uFirst;varying vec2 vUv;
vec3 s(vec2 uv){vec3 c=texture2D(tSrc,uv).rgb;return uFirst>.5?min(c,vec3(40.)):c;}
void main(){vec3 c=s(vUv)*4.+s(vUv-uTx)+s(vUv+uTx)+s(vUv+vec2(uTx.x,-uTx.y))+s(vUv+vec2(-uTx.x,uTx.y));gl_FragColor=vec4(c*.125,1.);}`);
const upMat=fsMat({tLow:{value:null},tHigh:{value:null},uTx:{value:new THREE.Vector2()}},`
uniform sampler2D tLow,tHigh;uniform vec2 uTx;varying vec2 vUv;
vec3 s(vec2 o){return texture2D(tLow,vUv+o*uTx).rgb;}
void main(){vec3 c=s(vec2(-2.,0.))+s(vec2(2.,0.))+s(vec2(0.,-2.))+s(vec2(0.,2.))+2.*(s(vec2(-1.,1.))+s(vec2(1.,1.))+s(vec2(1.,-1.))+s(vec2(-1.,-1.)));
gl_FragColor=vec4(c/12.+texture2D(tHigh,vUv).rgb,1.);}`);
const compMat=fsMat({tHDR:{value:null},tBloom:{value:null},uRes:{value:new THREE.Vector2(W,H)},uTime:{value:0},uExp:{value:1},uBloom:{value:.07},
  uWhip:{value:0},uFlash:{value:0},uFade:{value:0},uCA:{value:.006},uGrain:{value:.045},uVig:{value:.5},uEdge:{value:.3},uSat:{value:1.06}},`
uniform sampler2D tHDR,tBloom;uniform vec2 uRes;uniform float uTime,uExp,uBloom,uWhip,uFlash,uFade,uCA,uGrain,uVig,uEdge,uSat;varying vec2 vUv;
vec3 fit(vec3 v){vec3 a=v*(v+.0245786)-.000090537;vec3 b=v*(.983729*v+.4329510)+.238081;return a/b;}
vec3 aces(vec3 c){const mat3 I=mat3(vec3(.59719,.07600,.02840),vec3(.35458,.90834,.13383),vec3(.04823,.01566,.83777));
  const mat3 O=mat3(vec3(1.60475,-.10208,-.00327),vec3(-.53108,1.10813,-.07276),vec3(-.07367,-.00605,1.07602));return clamp(O*fit(I*(c/.6)),0.,1.);}
vec3 srgb(vec3 c){c=clamp(c,0.,1.);return mix(c*12.92,1.055*pow(c,vec3(1./2.4))-.055,step(.0031308,c));}
float hash(vec2 p){vec3 p3=fract(vec3(p.xyx)*.1031);p3+=dot(p3,p3.yzx+33.33);return fract((p3.x+p3.y)*p3.z);}
vec3 samp(vec2 uv){vec2 d=uv-.5;vec2 o=d*uCA*(.35+2.4*dot(d,d));return vec3(texture2D(tHDR,uv+o).r,texture2D(tHDR,uv).g,texture2D(tHDR,uv-o).b);}
void main(){
  vec3 col;
  if(uWhip>.002){col=vec3(0.);for(int i=0;i<16;i++){float f=float(i)/15.-.5;col+=samp(vUv+vec2(f*uWhip*.14,f*uWhip*.01));}col/=16.;}
  else col=samp(vUv);
  vec3 bl=texture2D(tBloom,vUv).rgb*(1./6.);
  vec2 q=vUv-.5;q.x*=uRes.x/uRes.y;float e=smoothstep(.36,.7,length(q));
  col=mix(col,bl,e*uEdge);
  col=mix(col,bl,uBloom)+max(bl-.85,0.)*.5;
  col=aces(col*uExp);
  float l=dot(col,vec3(.2126,.7152,.0722));col=mix(vec3(l),col,uSat);
  col=srgb(col);
  col=mix(col,col*col*(3.-2.*col),.16);
  float v=length((vUv-.5)*vec2(1.,1.12));col*=1.-uVig*smoothstep(.32,.86,v);
  col+=uFlash*vec3(1.,.95,.86);
  col+=(hash(vUv*uRes+fract(uTime*7.31)*317.)-.5)*uGrain*(1.-.5*l);
  col*=1.-uFade;
  gl_FragColor=vec4(col,1.);
}`);
function pass(mat,target){fsQuad.material=mat;renderer.setRenderTarget(target);renderer.render(fsScene,fsCam)}

/* ============================== scene, camera, lights, environment ============================== */
const scene=new THREE.Scene();
const camera=new THREE.PerspectiveCamera(44,W/H,.05,200);
// animated studio backdrop (full-screen quad drawn first)
const bgMat=new THREE.ShaderMaterial({uniforms:{uEdge:{value:new THREE.Color()},uMid:{value:new THREE.Color()},uGlow:{value:new THREE.Color()},uTime:{value:0},uOff:{value:new THREE.Vector2(0,0)}},
  vertexShader:'varying vec2 vUv;void main(){vUv=uv;gl_Position=vec4(position.xy,.9999,1.);}',
  fragmentShader:`uniform vec3 uEdge,uMid,uGlow;uniform float uTime;uniform vec2 uOff;varying vec2 vUv;
float h21(vec2 p){p=fract(p*vec2(123.34,456.21));p+=dot(p,p+45.32);return fract(p.x*p.y);}
float vn(vec2 p){vec2 i=floor(p),f=fract(p);f=f*f*(3.-2.*f);return mix(mix(h21(i),h21(i+vec2(1,0)),f.x),mix(h21(i+vec2(0,1)),h21(i+vec2(1,1)),f.x),f.y);}
void main(){
  vec2 uv=vUv+uOff;vec2 p=uv-vec2(.5,.54);p.x*=.5625;float r=length(p);
  vec3 c=mix(uMid,uEdge,smoothstep(.04,.66,r));
  c+=uGlow*exp(-r*r*12.)*.8;
  float u=uv.x*.9+uv.y*.42,sh=0.;
  sh+=smoothstep(.07,0.,abs(u-.66-.03*sin(uTime*.31)))*.6;
  sh+=smoothstep(.035,0.,abs(u-.84+.02*sin(uTime*.23)))*.4;
  sh+=smoothstep(.11,0.,abs(u-.47-.02*sin(uTime*.17)))*.28;
  sh*=smoothstep(.1,1.,uv.y)*(.55+.45*vn(vec2(u*16.,uTime*.3)));
  c+=uGlow*sh*.32;
  c*=.88+.24*vn(uv*vec2(3.,5.)+vec2(uTime*.02,-uTime*.035));
  gl_FragColor=vec4(c,1.);
}`,depthWrite:false,depthTest:false});
const bgQuad=new THREE.Mesh(new THREE.PlaneGeometry(2,2),bgMat);bgQuad.frustumCulled=false;bgQuad.renderOrder=-100;scene.add(bgQuad);
const LOOKS=[ // blue set / gold set, alternating per scene
  {edge:lin('#020818').multiplyScalar(1),mid:lin('#0c2f86').multiplyScalar(1.25),glow:lin('#3a86ff').multiplyScalar(1.3),acc:'#ffc93c',exp:1.0},
  {edge:lin('#3a1800').multiplyScalar(1),mid:lin('#c47504').multiplyScalar(1.3),glow:lin('#ffcf55').multiplyScalar(1.35),acc:'#59b0ff',exp:1.0}
];
(function(){ // studio reflections: soft strip lights for crisp highlights on polished metal
  try{
    const envS=new THREE.Scene();
    const c=document.createElement('canvas');c.width=4;c.height=256;const g=c.getContext('2d');
    const gr=g.createLinearGradient(0,0,0,256);gr.addColorStop(0,'#6f7684');gr.addColorStop(.45,'#2c3038');gr.addColorStop(.55,'#24262c');gr.addColorStop(1,'#0d0e11');
    g.fillStyle=gr;g.fillRect(0,0,4,256);
    envS.add(new THREE.Mesh(new THREE.SphereGeometry(50,32,16),new THREE.MeshBasicMaterial({map:new THREE.CanvasTexture(c),side:THREE.BackSide})));
    const sb=(w,h,p,col,s)=>{const m=new THREE.Mesh(new THREE.PlaneGeometry(w,h),new THREE.MeshBasicMaterial({side:THREE.DoubleSide}));
      m.material.color.set(col).multiplyScalar(s);m.position.copy(p);m.lookAt(0,0,0);envS.add(m)};
    sb(26,5,V(-8,16,14),'#fff2e2',5.5);    // top-left key strip
    sb(4,22,V(19,3,6),'#e6f0ff',3.2);      // right vertical strip
    sb(4,20,V(-20,0,4),'#ffe6c8',2.2);     // left vertical strip
    sb(20,9,V(2,10,-20),'#cfe0ff',2.6);    // back light
    sb(14,3,V(0,-14,10),'#ffffff',1.4);    // floor bounce
    sb(6,6,V(8,8,18),'#ffffff',4);         // small front kicker
    const pm=new THREE.PMREMGenerator(renderer);scene.environment=pm.fromScene(envS,.02).texture;pm.dispose();
  }catch(e){console.warn('env map failed',e)}
})();
const hemi=new THREE.HemisphereLight(0xdfe8ff,0x1c140a,.35);scene.add(hemi);
const key=new THREE.DirectionalLight(0xfff0dc,2.1);key.castShadow=true;key.shadow.mapSize.set(2048,2048);
Object.assign(key.shadow.camera,{left:-4.5,right:4.5,top:4.5,bottom:-4.5,near:.5,far:40});key.shadow.bias=-.0004;key.shadow.normalBias=.02;
scene.add(key,key.target);
const rimL=new THREE.DirectionalLight(0xa9c8ff,1.3);scene.add(rimL,rimL.target);
const fillL=new THREE.DirectionalLight(0xffdcb0,.45);scene.add(fillL,fillL.target);

/* ============================== procedural finishes ============================== */
function cvs(w,h,draw){const c=document.createElement('canvas');c.width=w;c.height=h;draw(c.getContext('2d'),w,h);return c}
function tex(c,{rep=1,srgb=false,clampE=false}={}){const t=new THREE.CanvasTexture(c);t.wrapS=t.wrapT=clampE?THREE.ClampToEdgeWrapping:THREE.RepeatWrapping;
  t.repeat.set(rep,rep);t.anisotropy=Math.min(8,renderer.capabilities.getMaxAnisotropy());if(srgb)t.encoding=THREE.sRGBEncoding;return t}
// circular graining (wheels)
const T_GRAIN=tex(cvs(512,512,(g,w,h)=>{g.fillStyle='#c8c8c8';g.fillRect(0,0,w,h);
  for(let r=1;r<370;r+=1.25){const v=140+Math.floor(rnd()*100);g.strokeStyle=`rgba(${v},${v},${v},.6)`;g.lineWidth=1.25;g.beginPath();g.arc(w/2,h/2,r,0,TAU);g.stroke()}}),{clampE:true});
// perlage (overlapping spun circles)
const T_PERL=tex(cvs(512,512,(g,w,h)=>{g.fillStyle='#8c8c8c';g.fillRect(0,0,w,h);const s=64,R=46;
  for(let j=-1;j<=8;j++)for(let i=-1;i<=8;i++){
    const x=i*s+(((j%2)+2)%2?s/2:0),y=j*s,seedA=(((i%8)+8)%8*7+((j%8)+8)%8*13)*.61;
    let gr;if(g.createConicGradient){gr=g.createConicGradient(seedA,x,y);for(let k=0;k<=14;k++){const v=k%2?205:95;gr.addColorStop(k/14,`rgb(${v},${v},${v})`)}}
    else{gr=g.createRadialGradient(x,y,0,x,y,R);gr.addColorStop(0,'#ddd');gr.addColorStop(1,'#666')}
    g.fillStyle=gr;g.beginPath();g.arc(x,y,R,0,TAU);g.fill();
    const rg=g.createRadialGradient(x,y,R*.2,x,y,R);rg.addColorStop(0,'rgba(255,255,255,.18)');rg.addColorStop(.85,'rgba(0,0,0,0)');rg.addColorStop(1,'rgba(0,0,0,.35)');
    g.fillStyle=rg;g.beginPath();g.arc(x,y,R,0,TAU);g.fill();
  }}));
// côtes de Genève stripes
const T_COTES=tex(cvs(512,512,(g,w,h)=>{const n=4,sw=w/n;for(let i=0;i<n;i++){const gr=g.createLinearGradient(i*sw,0,(i+1)*sw,0);
  gr.addColorStop(0,'#555');gr.addColorStop(.42,'#e2e2e2');gr.addColorStop(.58,'#cfcfcf');gr.addColorStop(1,'#4d4d4d');g.fillStyle=gr;g.fillRect(i*sw,0,sw,h)}
  for(let k=0;k<900;k++){const v=120+rnd()*100;g.fillStyle=`rgba(${v},${v},${v},.08)`;g.fillRect(rnd()*w,0,1,h)}}));
T_COTES.repeat.set(.55,.55);T_COTES.rotation=.45;
// sunburst dial relief
const T_SUN=tex(cvs(1024,1024,(g,w,h)=>{g.fillStyle='#808080';g.fillRect(0,0,w,h);g.translate(w/2,h/2);
  for(let i=0;i<1600;i++){const a=i/1600*TAU+rnd()*.002,v=50+Math.floor(rnd()*160);g.strokeStyle=`rgba(${v},${v},${v},.7)`;g.lineWidth=1.4;g.beginPath();g.moveTo(0,0);g.lineTo(Math.cos(a)*740,Math.sin(a)*740);g.stroke()}}),{clampE:true});
// leather strap
const T_LEATHER=tex(cvs(256,512,(g,w,h)=>{g.fillStyle='#3b2416';g.fillRect(0,0,w,h);
  for(let k=0;k<5000;k++){const v=rnd();g.fillStyle=v>.5?'rgba(255,220,180,.05)':'rgba(0,0,0,.12)';g.fillRect(rnd()*w,rnd()*h,1+rnd()*2,1+rnd()*2)}
  const eg=g.createLinearGradient(0,0,w,0);eg.addColorStop(0,'rgba(0,0,0,.45)');eg.addColorStop(.12,'rgba(0,0,0,0)');eg.addColorStop(.88,'rgba(0,0,0,0)');eg.addColorStop(1,'rgba(0,0,0,.45)');g.fillStyle=eg;g.fillRect(0,0,w,h);
  g.fillStyle='#d9c29a';for(let y=8;y<h;y+=24){g.fillRect(22,y,4,14);g.fillRect(w-26,y,4,14)}}),{srgb:true,clampE:true});
// soft glow sprite
const T_GLOW=tex(cvs(128,128,(g,w,h)=>{const gr=g.createRadialGradient(64,64,0,64,64,64);gr.addColorStop(0,'rgba(255,255,255,1)');gr.addColorStop(.18,'rgba(255,255,255,.55)');gr.addColorStop(.5,'rgba(255,255,255,.12)');gr.addColorStop(1,'rgba(255,255,255,0)');g.fillStyle=gr;g.fillRect(0,0,w,h)}),{clampE:true});
// printed dial (drawn once the fonts are ready)
const dialCanvas=document.createElement('canvas');dialCanvas.width=dialCanvas.height=1024;
const T_DIAL=tex(dialCanvas,{srgb:true,clampE:true});
function drawDial(){
  const g=dialCanvas.getContext('2d'),c=512;
  const bg=g.createRadialGradient(c,c*.9,40,c,c,c);bg.addColorStop(0,'#fbfbf8');bg.addColorStop(.75,'#ecece8');bg.addColorStop(1,'#d5d6d4');
  g.fillStyle=bg;g.fillRect(0,0,1024,1024);
  g.save();g.translate(c,c);
  for(let i=0;i<60;i++){const a=i/60*TAU,big=i%5===0;g.save();g.rotate(a);g.fillStyle=big?'#1c2232':'#5a6070';g.fillRect(big?-3:-1.5,-500,big?6:3,big?30:20);g.restore()}
  g.strokeStyle='rgba(30,36,50,.5)';g.lineWidth=2;g.beginPath();g.arc(0,0,466,0,TAU);g.stroke();
  g.textAlign='center';g.textBaseline='middle';g.fillStyle='#1b2133';
  g.font='900 50px "Inter Tight",system-ui,sans-serif';if('letterSpacing' in g)g.letterSpacing='10px';g.fillText('MECHANICA',5,-205);
  g.font='800 22px "Inter Tight",system-ui,sans-serif';if('letterSpacing' in g)g.letterSpacing='8px';g.fillStyle='#8a1424';g.fillText('HAND-WOUND',4,-158);
  g.fillStyle='#4a5162';g.font='800 22px "Inter Tight",system-ui,sans-serif';g.fillText('17 JEWELS',4,250);
  g.restore();T_DIAL.needsUpdate=true;
}

/* ============================== materials ============================== */
const std=(o)=>new THREE.MeshStandardMaterial(o);
const MAT={
  gold:std({color:lin('#f3c25a'),metalness:1,roughness:.36,roughnessMap:T_GRAIN,bumpMap:T_GRAIN,bumpScale:.0016}),
  goldPol:std({color:lin('#f6c96c'),metalness:1,roughness:.14}),
  rose:std({color:lin('#f0b58c'),metalness:1,roughness:.3,roughnessMap:T_GRAIN,bumpMap:T_GRAIN,bumpScale:.0014}),
  steel:std({color:lin('#e8ebf0'),metalness:1,roughness:.24,roughnessMap:T_GRAIN,bumpMap:T_GRAIN,bumpScale:.0012}),
  steelPol:std({color:lin('#f0f2f5'),metalness:1,roughness:.08}),

function drawHUD(st){
  const g=octx,h=st.h,acc=st.acc,x=150,y=150,w=780,hh=170;frost(x,y,w,hh,32,.55);
  g.save();g.textBaseline='alphabetic';g.textAlign='left';
  g.font='800 64px '+MONO;ls(0);g.fillStyle='#fff';g.shadowColor='rgba(0,0,0,.5)';g.shadowBlur=8;g.fillText(h.main,x+40,y+84);g.shadowBlur=0;
  g.font='800 26px '+FONT;ls(2);g.fillStyle='rgba(255,255,255,.72)';g.fillText(h.sub.toUpperCase(),x+40,y+126);
  const bx=x+40,by=y+hh-26,bw=w-80;rrp(g,bx,by,bw,10,5);g.fillStyle='rgba(255,255,255,.16)';g.fill();
  rrp(g,bx,by,Math.max(10,bw*clamp(h.bar)),10,5);g.fillStyle=acc;g.fill();
  if(h.pedal!==undefined&&st.si>0){g.textAlign='right';g.font='800 24px '+FONT;ls(3);g.fillStyle=acc;g.fillText('PEDAL',x+w-40,y+44);
    g.font='800 52px '+MONO;ls(0);g.fillStyle='#fff';g.fillText(Math.round(h.pedal*100)+'%',x+w-40,y+100)}
  g.restore();ls(0);
}
function drawOverlay(st){
  const g=octx,acc=st.acc,tl=st.tl;
  // callouts
  CALL.forEach(c=>{if(c.si===st.si)drawCallout(c,tl,acc)});
  // CLICK when the gear collar engages
  if(st.si===4&&S5.pop&&S5.pop.age>=0){const pp=toScreen(S5.pop.obj,V(0,0,0));if(pp)drawPop('CLICK',pp[0]+230,pp[1]-150,S5.pop.age,acc,.12)}
  drawHUD(st);
  // captions
  const cs=CAPS[st.si];let ci=0;cs.forEach((c,i)=>{if(tl>=c[0])ci=i});drawCaption(cs[ci][1],tl-cs[ci][0],acc);
}

/* ============================== timeline ============================== */
const updaters=[update0,update1,update2,update3,update4];
const el={seek:document.getElementById('seek'),time:document.getElementById('time'),play:document.getElementById('play'),rec:document.getElementById('rec')};
let T=0,playing=true,recording=null,lastScene=-1;
const WHIP=.2;
let ST=null;
function update(t){
  t=clamp(t||0,0,TOTAL-1e-4);
  const si=Math.min(NS-1,Math.floor(t/SCENE_T)),tl=t-si*SCENE_T,look=LOOKS[si%2];
  groups.forEach((g,i)=>g.visible=i===si);
  const h=updaters[si](tl);
  // whip-pan transitions between scenes
  let wv=0,yaw=0;
  if(si<NS-1&&tl>SCENE_T-WHIP){const w=(tl-(SCENE_T-WHIP))/WHIP,d=(si+1)%2?1:-1;wv=w*w;yaw=d*wv*.42}
  if(si>0&&tl<WHIP){const w=1-tl/WHIP,d=si%2?1:-1;wv=w*w;yaw=-d*wv*.42}
  shotCam(si,tl,{yaw,shake:h.shake||0,punch:h.shake||0});
  // lights and dust follow the subject
  const c=curC;key.position.set(c.x-3,c.y+5,c.z+7);key.target.position.copy(c);rimL.position.set(c.x+2,c.y+4,c.z-6);rimL.target.position.copy(c);
  fillL.position.set(c.x+5,c.y-1,c.z+4);fillL.target.position.copy(c);dust.position.copy(c);
  dust.material.uniforms.uTime.value=t*SLOW;dust.material.uniforms.uFocus.value=camera.position.distanceTo(c);
  bgMat.uniforms.uEdge.value.copy(look.edge);bgMat.uniforms.uMid.value.copy(look.mid);bgMat.uniforms.uGlow.value.copy(look.glow);bgMat.uniforms.uTime.value=t*SLOW;
  bgMat.uniforms.uOff.value.set(yaw*-.25,0);
  const U=compMat.uniforms;U.uTime.value=t;U.uWhip.value=wv;U.uFlash.value=.22*wv*wv;U.uExp.value=look.exp;
  U.uFade.value=Math.max(1-seg(t,0,.3),seg(t,TOTAL-.35,TOTAL));
  scene.updateMatrixWorld(true);
  if(si!==lastScene){lastScene=si;document.querySelectorAll('.sc').forEach(b=>b.classList.toggle('on',+b.dataset.s===si))}
  if(document.activeElement!==el.seek)el.seek.value=t;
  el.time.textContent=(t*SLOW).toFixed(1)+' / '+Math.round(TOTAL*SLOW)+' s';
  ST={si,tl,T:t,h,acc:look.acc};
}
function renderFrame(){
  renderer.setRenderTarget(rtScene);renderer.render(scene,camera);
  let src=rtScene.texture,sw=W,sh=H;
  MIPS.forEach((m,i)=>{downMat.uniforms.tSrc.value=src;downMat.uniforms.uTx.value.set(1/sw,1/sh);downMat.uniforms.uFirst.value=i?0:1;pass(downMat,m.d);src=m.d.texture;sw=m.w;sh=m.h});
  for(let i=MIPS.length-2;i>=0;i--){const low=i===MIPS.length-2?MIPS[i+1].d:MIPS[i+1].u;upMat.uniforms.tLow.value=low.texture;upMat.uniforms.tHigh.value=MIPS[i].d.texture;
    upMat.uniforms.uTx.value.set(.5/MIPS[i+1].w,.5/MIPS[i+1].h);pass(upMat,MIPS[i].u)}
  compMat.uniforms.tHDR.value=rtScene.texture;compMat.uniforms.tBloom.value=MIPS[0].u.texture;pass(compMat,null);
  octx.drawImage(glCanvas,0,0);
  if(ST)drawOverlay(ST);
  const f=compMat.uniforms.uFade.value;if(f>0){octx.fillStyle=`rgba(0,0,0,${f})`;octx.fillRect(0,0,W,H)}
}
let last=performance.now();
function loop(now){
  const dt=clamp((now-last)/1000,0,.1);last=now;
  if(playing){T+=dt/SLOW;if(T>=TOTAL){if(recording)stopRec();T=T%TOTAL}}
  update(T);renderFrame();requestAnimationFrame(loop);
}
const setPlay=p=>{playing=p;el.play.textContent=p?'❚❚':'▶'};
el.play.onclick=()=>setPlay(!playing);
el.seek.oninput=()=>{T=+el.seek.value};
document.querySelectorAll('.sc').forEach(b=>b.onclick=()=>{T=+b.dataset.s*SCENE_T+.01});
window.addEventListener('keydown',e=>{if(e.code==='Space'){e.preventDefault();el.play.click()}
  if(e.code==='ArrowRight')T=Math.min(TOTAL-.01,T+.5);if(e.code==='ArrowLeft')T=Math.max(0,T-.5)});
function stopRec(){if(recording){recording.stop();recording=null;el.rec.textContent='● REC';el.rec.classList.remove('on')}}
el.rec.onclick=()=>{
  if(recording){stopRec();return}
  if(!window.MediaRecorder||!out.captureStream){alert('Recording is not supported in this browser.');return}
  const types=['video/mp4;codecs=avc1.640028','video/mp4','video/webm;codecs=vp9','video/webm'],mime=types.find(m=>MediaRecorder.isTypeSupported(m))||'';
  const stream=out.captureStream(60),chunks=[],mr=new MediaRecorder(stream,mime?{mimeType:mime,videoBitsPerSecond:20e6}:{videoBitsPerSecond:20e6});
  const ext=(mr.mimeType||mime).includes('mp4')?'mp4':'webm';
  mr.ondataavailable=e=>e.data.size&&chunks.push(e.data);
  mr.onstop=()=>{const a=document.createElement('a');a.href=URL.createObjectURL(new Blob(chunks,{type:mr.mimeType||'video/'+ext}));a.download='how-a-clutch-works.'+ext;a.click()};
  T=0;setPlay(true);recording=mr;mr.start(250);el.rec.textContent='■ STOP';el.rec.classList.add('on');
};
window.__setT=t=>{T=t;setPlay(false);update(T);renderFrame()};
// render hook (see README): duration in real seconds, seek(seconds) draws that exact frame
window.VIDEO={get duration(){return TOTAL*SLOW},seek(s){window.__setT(s/SLOW)}};
const fontsReady=Promise.race([Promise.all(['800 40px "Inter Tight"','900 40px "Inter Tight"','800 40px "JetBrains Mono"'].map(f=>document.fonts.load(f))).catch(()=>{}),new Promise(r=>setTimeout(r,2500))]);
fontsReady.then(()=>{update(0);renderFrame();window.__ready=true;requestAnimationFrame(loop)});
</script>
